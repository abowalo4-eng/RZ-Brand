<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZ Brand - دوکانا جلوبەرگان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 50px; }
        header { background-color: #1e293b; color: white; padding: 20px; text-align: center; position: relative; }
        
        .sub-categories { display: flex; justify-content: center; gap: 8px; background: #e2e8f0; padding: 12px; overflow-x: auto; }
        .sub-categories button { background: white; color: #334155; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .sub-categories button.active, .sub-categories button:hover { background: #1e293b; color: white; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; padding: 15px; position: relative; }
        .product-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; }
        .product-card h3 { font-size: 18px; margin: 15px 0 10px; }
        .price { font-size: 16px; color: #16a34a; font-weight: bold; margin-bottom: 15px; }
        .badge { position: absolute; top: 25px; right: 25px; background: #2563eb; color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        
        button.buy-btn { background-color: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; font-weight: bold; }
        button.buy-btn:hover { background-color: #15803d; }

        .hidden-admin-trigger { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; z-index: 10; }
        
        .admin-panel { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        .admin-panel input, .admin-panel select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .btn-green { background-color: #16a34a; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .logout-btn { background-color: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; float: left; }
    </style>
</head>
<body>

    <header>
        <button class="hidden-admin-trigger" onclick="requestAdminAccess()">⚙️ ڕێڤەبەر</button>
        <h1>RZ Brand</h1>
        <p>باشترین و جوانترین جلوبەرگ</p>
    </header>

    <div class="sub-categories">
        <button onclick="setSubCat('all')" id="sub-all" class="active">هەمی بەرهەم</button>
        <button onclick="setSubCat('tshirt')" id="sub-tshirt">تیشێرت</button>
        <button onclick="setSubCat('shirt')" id="sub-shirt">قەمیس</button>
        <button onclick="setSubCat('jeans')" id="sub-jeans">کابۆ</button>
        <button onclick="setSubCat('shoes')" id="sub-shoes">پێلاف</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <button class="logout-btn" onclick="logout()">چوونە دەرڤە</button>
        <h3 style="margin-bottom: 15px; color: #1e293b; clear: both;">زیادکرنا بەرهەمەکا نوو</h3>
        <input type="text" id="pName" placeholder="ناڤێ بەرهەمی (بۆ نموونە: تیشێرتی OC Navy)">
        <input type="text" id="pPrice" placeholder="نرخ (بۆ نموونە: 15000)">
        <input type="text" id="pImage" placeholder="لینکا وێنەی (رابط مباشر)">
        
        <label style="font-size: 14px; font-weight: bold; color: #475569;">جۆرێ بەرهەمی:</label>
        <select id="pSubCat">
            <option value="tshirt">تیشێرت</option>
            <option value="shirt">قەمیس</option>
            <option value="jeans">کابۆ</option>
            <option value="shoes">پێلاف</option>
        </select>

        <button class="btn-green" onclick="addProduct()">زیادکرن ل سەر سایت</button>
    </div>

    <div class="container" id="products-container">
        <p style="text-align:center; grid-column: 1/-1; color: #64748b; padding: 30px;">یا داتی بار دکەت...</p>
    </div>

    <script>
        const whatsappNumber = '9647507070313';
        const adminPassword = 'zaxorz@1010';
        
        // داتابەیسا گشتی و یا نوو
        const BIN_ID = '67cc3f68e41b4d34e49ea23a';
        const API_KEY = '$2a$10$w4C344k4X1fK4y5D.gN2leTzF5r32B1l2n9/Z9K8X2Q2u1K1m1K1m'; 
        
        let currentSub = 'all';
        let allProducts = [];

        function requestAdminAccess() {
            let pass = prompt("پاسووردێ ڕێڤەبەری بنڤیسە:");
            if(pass === adminPassword) {
                localStorage.setItem('rz_logged', 'true');
                checkAuth();
                alert('ب خێر هاتێ، ڕێڤەبەر!');
            } else if(pass !== null) {
                alert('پاسوورد خەلەتە!');
            }
        }

        function logout() {
            localStorage.removeItem('rz_logged');
            checkAuth();
        }

        function checkAuth() {
            let isLogged = localStorage.getItem('rz_logged');
            if(isLogged === 'true') {
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

        function setSubCat(sub) {
            currentSub = sub;
            document.querySelectorAll('.sub-categories button').forEach(b => b.classList.remove('active'));
            document.getElementById('sub-' + sub).classList.add('active');
            renderProducts();
        }

        async function fetchProducts() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let data = await res.json();
                allProducts = data.record || [];
                renderProducts();
            } catch (err) {
                renderProducts();
            }
        }

        function renderProducts() {
            let container = document.getElementById('products-container');
            container.innerHTML = '';

            let filtered = currentSub === 'all' ? allProducts : allProducts.filter(p => p.sub === currentSub);

            if(filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #64748b; padding: 30px; font-size: 16px;">چ بەرهەم د ڤی بەشی دا نینە.</p>';
                return;
            }

            filtered.forEach(p => {
                let subName = p.sub === 'tshirt' ? 'تیشێرت' : (p.sub === 'shirt' ? 'قەمیس' : (p.sub === 'jeans' ? 'کابۆ' : 'پێلاف'));
                container.innerHTML += `
                    <div class="product-card">
                        <span class="badge">${subName}</span>
                        <img src="${p.image}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p class="price">${p.price} دينار</p>
                        <button class="buy-btn" onclick="buy('${p.name}', '${p.price}')">داخوازکرن</button>
                    </div>
                `;
            });
        }

        async function addProduct() {
            let name = document.getElementById('pName').value;
            let price = document.getElementById('pPrice').value;
            let image = document.getElementById('pImage').value;
            let sub = document.getElementById('pSubCat').value;

            if(!name || !price || !image) {
                alert('هەمی خانەیان تژی بکە!');
                return;
            }

            let newProduct = {name, price, image, sub};
            allProducts.unshift(newProduct);

            try {
                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(allProducts)
                });

                if(updateRes.ok) {
                    document.getElementById('pName').value = '';
                    document.getElementById('pPrice').value = '';
                    document.getElementById('pImage').value = '';
                    renderProducts();
                    alert('بەرهەم ب سەرکەفتن هاتە زیادکرن و نوکە ل دەف هەمی کەسان ل جیهانێ دیار دبیت!');
                } else {
                    alert('پاشەکەوت نەکربوو، تکایە دووبارە تاقی بکەڤە.');
                }
            } catch (err) {
                alert('ئاریشەک د پەیوەندیێ دا چێبوو.');
            }
        }

        function buy(name, price) {
            let msg = `سڵاو، من دڤێت ڤی بەرهەمی داخوازم بکەم:\nبەرهەم: ${name}\nنرخ: ${price} دينار`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        checkAuth();
        fetchProducts();
    </script>
</body>
</html>
