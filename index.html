<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZ Brand - دوکانا تیشێرتان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 50px; }
        header { background-color: #1e293b; color: white; padding: 20px; text-align: center; }
        
        .login-container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .login-container input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; }
        .login-container button { width: 100%; padding: 12px; background: #1e293b; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        .admin-panel { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        .admin-panel input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; padding: 15px; }
        .product-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; }
        .product-card h3 { font-size: 18px; margin: 15px 0 10px; }
        .price { font-size: 16px; color: #16a34a; font-weight: bold; margin-bottom: 15px; }
        
        button.buy-btn { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; font-weight: bold; }
        button.buy-btn:hover { background-color: #1d4ed8; }
        .btn-green { background-color: #16a34a; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .logout-btn { background-color: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; float: left; }
    </style>
</head>
<body>

    <header>
        <h1>RZ Brand</h1>
        <p>باشترین و جوانترین تیشێرت</p>
    </header>

    <!-- شاشەیا چوونە ژوورێ (Login) -->
    <div class="login-container" id="loginBox">
        <h3 style="margin-bottom: 20px; color: #1e293b;">چوونە ژوورا ڕێڤەبەری</h3>
        <input type="password" id="passInput" placeholder="پاسوورد بنڤیسە (بۆ نموونە: 1234)">
        <button onclick="login()">چوونەژوور</button>
    </div>

    <!-- پەنێلا ڕێڤەبەری و زێدەکرنا بەرهەمان (تنێ پشتی پاسووردەی دیار دبیت) -->
    <div class="admin-panel" id="adminPanel">
        <button class="logout-btn" onclick="logout()">چوونە دەرڤە (Logout)</button>
        <h3 style="margin-bottom: 15px; color: #1e293b; clear: both;">زیادکرنا تیشێرتەکا نوو</h3>
        <input type="text" id="pName" placeholder="ناڤێ تیشێرتی (بۆ نموونە: OC Navy)">
        <input type="text" id="pPrice" placeholder="نرخ (بۆ نموونە: 15000)">
        <input type="text" id="pImage" placeholder="لینکا وێنەی (Image URL)">
        <button class="btn-green" onclick="addProduct()">زیادکرن ل سەر سایت</button>
    </div>

    <!-- کەتەلۆگێ بەرهەمان -->
    <div class="container" id="products-container"></div>

    <script>
        const whatsappNumber = '964750000000';
        const correctPassword = '1234'; // لێرە تو پاسووردێ خۆ دگۆڕی ئەگەر بڤێی

        function login() {
            let val = document.getElementById('passInput').value;
            if(val === correctPassword) {
                localStorage.setItem('rz_logged', 'true');
                checkAuth();
            } else {
                alert('پاسوورد خەلەتە!');
            }
        }

        function logout() {
            localStorage.removeItem('rz_logged');
            checkAuth();
        }

        function checkAuth() {
            let isLogged = localStorage.getItem('rz_logged');
            if(isLogged === 'true') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

        function loadProducts() {
            let products = JSON.parse(localStorage.getItem('rz_products')) || [
                {name: "تيشيرتی لۆنگ-سليفی (OC Navy)", price: "15,000", image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=600"}
            ];

            let container = document.getElementById('products-container');
            container.innerHTML = '';

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p class="price">${p.price} دينار</p>
                        <button class="buy-btn" onclick="buy('${p.name}', '${p.price}')">زيادکردن بۆ سەبەتە</button>
                    </div>
                `;
            });
        }

        function addProduct() {
            let name = document.getElementById('pName').value;
            let price = document.getElementById('pPrice').value;
            let image = document.getElementById('pImage').value;

            if(!name || !price || !image) {
                alert('هەمی خانەیان تژی بکە!');
                return;
            }

            let products = JSON.parse(localStorage.getItem('rz_products')) || [
                {name: "تيشيرتی لۆنگ-سليفی (OC Navy)", price: "15,000", image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=600"}
            ];

            products.push({name, price, image});
            localStorage.setItem('rz_products', JSON.stringify(products));

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImage').value = '';

            loadProducts();
            alert('تیشێرت ب سەرکەفتن هاتە زیادکرن!');
        }

        function buy(name, price) {
            let msg = `سڵاو، من دڤێت ڤی بەرهەمی بکڕم: ${name} - نرخ: ${price} دينار`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        checkAuth();
        loadProducts();
    </script>
</body>
</html>
