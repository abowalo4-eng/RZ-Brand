<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZ Brand | Luxury Store</title>
    <!-- Google Fonts & FontAwesome for Luxury Look -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-gold: #dfb15b;
            --text-main: #f3f3f3;
            --text-muted: #999999;
            --border-color: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Arabic', 'Unbounded', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Header Style */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #141414 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        header h1 span {
            color: var(--accent-gold);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Categories Filter */
        .categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 0 auto;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        /* Products Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .product-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background-color: #222;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .product-price {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-top: auto;
        }

        /* Buy / WhatsApp Button inside card */
        .buy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 12px;
            transition: background 0.3s ease;
        }

        .buy-btn:hover {
            background: #20ba5a;
        }

        /* Floating WhatsApp Icon */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background-color: #25d366;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 100;
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        @media(max-width: 768px) {
            header h1 { font-size: 1.7rem; }
            .product-img { height: 280px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>RZ <span>BRAND</span></h1>
        <p>کەتالوگێ فەرمی یێ جلوبەرگ و پێلاڤێن ڕاقی</p>
    </header>

    <!-- Categories Filter Buttons -->
    <div class="categories">
        <button class="cat-btn active" onclick="filterProduct('all')">هەمی</button>
        <button class="cat-btn" onclick="filterProduct('shirt')">تیشێرت و جل</button>
        <button class="cat-btn" onclick="filterProduct('shoes')">پێلاڤ</button>
        <button class="cat-btn" onclick="filterProduct('jacket')">چاکەت و پاڵتو</button>
    </div>

    <!-- Products Section -->
    <div class="container" id="product-grid">
        <!-- Product 1 -->
        <div class="product-card" data-category="shirt">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80" alt="تیشێرت" class="product-img">
            <div class="product-info">
                <span class="product-category">تیشێرت</span>
                <h3 class="product-title">تیشێرتا مۆدێرنا ڕەش</h3>
                <div class="product-price">25,000 دینار</div>
                <a href="https://wa.me/YOUR_WHATSAPP_NUMBER?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: تیشێرتا مۆدێرنا ڕەش" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> داخوازکرن ب واتسئاپ
                </a>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="product-card" data-category="shoes">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="پێلاڤ" class="product-img">
            <div class="product-info">
                <span class="product-category">پێلاڤ</span>
                <h3 class="product-title">پێلاڤا وەرزشی یا لۆکس</h3>
                <div class="product-price">45,000 دینار</div>
                <a href="https://wa.me/YOUR_WHATSAPP_NUMBER?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: پێلاڤا وەرزشی یا لۆکس" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> داخوازکرن ب واتسئاپ
                </a>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="product-card" data-category="jacket">
            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80" alt="چاکەت" class="product-img">
            <div class="product-info">
                <span class="product-category">چاکەت</span>
                <h3 class="product-title">چاکەتێ چەرمێ ڕەش</h3>
                <div class="product-price">65,000 دینار</div>
                <a href="https://wa.me/YOUR_WHATSAPP_NUMBER?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: چاکەتێ چەرمێ ڕەش" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> داخوازکرن ب واتسئاپ
                </a>
            </div>
        </div>
    </div>

    <!-- Floating WhatsApp Button (Replace YOUR_WHATSAPP_NUMBER with your actual number) -->
    <a href="https://wa.me/YOUR_WHATSAPP_NUMBER" target="_blank" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        // Simple Category Filter Script
        function filterProduct(category) {
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.buttonList?.remove?.('active'); // safety
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.product-card');
            cards.cardList?.remove?.('active');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
