<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZ Brand - دوکانا جلوبەرگان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding-bottom: 50px; }
        header { background-color: #1e293b; color: white; padding: 20px; text-align: center; }
        
        .main-categories { display: flex; justify-content: center; gap: 10px; background: #334155; padding: 12px; }
        .main-categories button { background: transparent; color: white; border: 1px solid #64748b; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .main-categories button.active, .main-categories button:hover { background: #2563eb; border-color: #2563eb; }

        .sub-categories { display: flex; justify-content: center; gap: 8px; background: #e2e8f0; padding: 10px; overflow-x: auto; }
        .sub-categories button { background: white; color: #334155; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .sub-categories button.active, .sub-categories button:hover { background: #1e293b; color: white; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; padding: 15px; }
        .product-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; }
        .product-card h3 { font-size: 18px; margin: 15px 0 10px; }
        .price { font-size: 16px; color: #16a34a; font-weight: bold; margin-bottom: 15px; }
        
        button.buy-btn { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; font-weight: bold; }
        button.buy-btn:hover { background-color: #1d4ed8; }

        /* پەنێلا ڕێڤەبەری (ڤەشارتي) */
        .hidden-admin-trigger { text-align: center; margin: 30px; font-size: 12px; color: #94a3b8; cursor: pointer; }
        .admin-panel { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        .admin-panel input, .admin-panel select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
        .btn-green { background-color: #16a34a; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        .logout-btn { background-color: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; float: left; }
    </style>
</head>
<body>

    <header>
        <h1>RZ Brand</h1>
        <p>باشترین و جوانترین جلوبەرگ</p>
    </header>

    <!-- بەشێن سەرەکی (زەڵام، ژن، زارۆک) -->
    <div class="main-categories">
        <button onclick="setMainCat('men')" id="btn-men" class="active">زەڵام</button>
        <button onclick="setMainCat('women')" id="btn-women">ژن</button>
        <button onclick="setMainCat('kids')" id="btn-kids">زارۆک</button>
    </div>

    <!-- بەشێن ناوەکی (کابۆ، قەمیس، تیشێرت، پێلاف) -->
    <div class="sub-categories">
        <button onclick="setSubCat('all')" id="sub-all" class="active">هەمی</button>
        <button onclick="setSubCat('tshirt')" id="sub-tshirt">تیشێرت</button>
        <button onclick="setSubCat('shirt')" id="sub-shirt">قەمیس</button>
        <button onclick="setSubCat('jeans')" id="sub-jeans">کابۆ</button>
        <button onclick="setSubCat('shoes')" id="sub-shoes">پێلاف</button>
    </div>

    <!-- کەتەلۆگێ بەرهەمان -->
    <div class="container" id="products-container"></div>

    <!-- دوگمەیا ڤەشارتي بۆ ڤەکرنا ڕێڤەبەری -->
    <div class="hidden-admin-trigger" onclick="requestAdminAccess()">⚙️ ڕێڤەبەر</div>

    <!-- پەنێلا ڕێڤەبەری -->
    <div class="admin-panel" id="adminPanel">
        <button class="logout-btn" onclick="logout()">چوونە دەرڤە</button>
        <h3 style="margin-bottom: 15px; color: #1e293b; clear: both;">زیادکرنا بەرهەمەکا نوو</h3>
        <input type="text" id="pName" placeholder="ناڤێ بەرهەمی (بۆ نموونە: تیشێرتی OC Navy)">
        <input type="text" id="pPrice" placeholder="نرخ (بۆ نموونە: 15000)">
        <input type="text" id="pImage" placeholder="لینکا وێنەی (Image URL)">
        
        <label style="font-size: 14px; font-weight: bold; color: #475569;">بەشێ سەرەکی:</label>
        <select id="pMainCat">
            <option value="men">زەڵام</option>
            <option value="women">ژن</option>
            <option value="kids">زارۆک</option>
        </select>

        <label style="font-size: 14px; font-weight: bold; color: #475569;">جۆرێ بەرهەمی:</label>
        <select id="pSubCat">
            <option value="tshirt">تیشێرت</option>
            <option value="shirt">قەمیس</option>
            <option value="jeans">کابۆ</option>
            <option value="shoes">پێلاف</option>
        </select>

        <button class="btn-green" onclick="addProduct()">زیادکرن ل سەر سایت</button>
    </div>

                alert('پاسوورد خەلەتە!');
            }

        function logout() {
            localStorage.removeItem('rz_logged');
            checkAuth();
        }

        function checkAuth() {
            let isLogged = localStorage.getItem('rz_logged');
            if(isLogged === 'true') {
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

            currentMain = cat;
            document.querySelectorAll('.main-categories button').forEach(b => b.classList.remove('active'));

            loadProducts();
        }

            currentSub = sub;
            document.querySelectorAll('.sub-categories button').forEach(b => b.classList.remove('active'));
            document.getElementById('sub-' + sub).classList.add('active');
            loadProducts();
        }
