<!DOCTYPE html>
<html lang="ku" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZ Brand | Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0c0c0e;
            --card-bg: #141417;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --border-color: #222226;
            --accent: #d4af37;
            --header-bg: rgba(12, 12, 14, 0.95);
        }

        html.light {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-muted: #6e6e73;
            --border-color: #e5e5ea;
            --accent: #b8860b;
            --header-bg: rgba(242, 242, 247, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Arabic', 'Unbounded', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            position: sticky;
            top: 0;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            z-index: 1000;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 260px;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            transition: right 0.3s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .side-menu.open {
            right: 0;
        }

        .side-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .close-menu {
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .side-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .side-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .side-links a:hover {
            color: var(--accent);
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            z-index: 1500;
            display: none;
        }

        .menu-overlay.active {
            display: block;
        }

        /* Categories Bar Compact */
        .categories-container {
            max-width: 1200px;
            margin: 15px auto 20px auto;
            padding: 0 15px;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 700;
        }

        /* Compact Grid Layout for products */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease;
        }

        .product-card:hover {
            border-color: var(--accent);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1c1c1f;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .product-category {
            font-size: 0.65rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .product-title {
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .product-price {
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .buy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #25d366;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            z-index: 100;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <i class="fas fa-bars menu-icon" onclick="toggleMenu()"></i>
            <a href="#" class="logo">RZ <span>BRAND</span></a>
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <a href="#" class="logo">RZ <span>BRAND</span></a>
            <i class="fas fa-times close-menu" onclick="toggleMenu()"></i>
        </div>
        <ul class="side-links">
            <li><a href="#" onclick="toggleMenu()"><i class="fas fa-home"></i> سەرەکی</a></li>
            <li><a href="https://maps.app.goo.gl/VbkZZed6Hf7g3emeA?g_st=ic" target="_blank"><i class="fas fa-map-marker-alt"></i> جهێ دکانی</a></li>
            <li><a href="https://wa.me/9647507070313?text=سڵاو، پەیوەندی ب مە ڤە" target="_blank"><i class="fas fa-phone-alt"></i> پەیوەندی کردن</a></li>
        </ul>
    </div>

    <!-- Filter Categories -->
    <div class="categories-container">
        <div class="categories">
            <button class="cat-btn active" onclick="filterProduct('all', event)"><i class="fas fa-border-all"></i> هەمی</button>
            <button class="cat-btn" onclick="filterProduct('kabu', event)"><i class="fas fa-vest"></i> کابو</button>
            <button class="cat-btn" onclick="filterProduct('shoes', event)"><i class="fas fa-shoe-prints"></i> پێلاڤ</button>
            <button class="cat-btn" onclick="filterProduct('shirt', event)"><i class="fas fa-tshirt"></i> تیشێرت</button>
            <button class="cat-btn" onclick="filterProduct('hoodie', event)"><i class="fas fa-user-ninja"></i> هوودی</button>
            <button class="cat-btn" onclick="filterProduct('jacket', event)"><i class="fas fa-user-tie"></i> چاکەت</button>
        </div>
    </div>

    <!-- Compact Grid -->
    <div class="container" id="product-grid">

        <!-- Kabu Items -->
        <div class="product-card" data-category="kabu">
            <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=400&q=80" alt="پانتۆلێ کابو" class="product-img">
            <div class="product-info">
                <span class="product-category">کابو</span>
                <h3 class="product-title">پانتۆلێ کابو</h3>
                <div class="product-price">35,000 دینار</div>
                <a href="https://wa.me/9647507070313?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: پانتۆلێ کابو" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> واتسئاپ
                </a>
            </div>
        </div>

        <!-- Shoes Items -->
        <div class="product-card" data-category="shoes">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=400&q=80" alt="پێلاڤ" class="product-img">
            <div class="product-info">
                <span class="product-category">پێلاڤ</span>
                <h3 class="product-title">پێلاڤا وەرزشی</h3>
                <div class="product-price">45,000 دینار</div>
                <a href="https://wa.me/9647507070313?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: پێلاڤا وەرزشی" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> واتسئاپ
                </a>
            </div>
        </div>

        <!-- Shirt Items -->
        <div class="product-card" data-category="shirt">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=400&q=80" alt="تیشێرت" class="product-img">
            <div class="product-info">
                <span class="product-category">تیشێرت</span>
                <h3 class="product-title">تیشێرتا ڕەش</h3>
                <div class="product-price">25,000 دینار</div>
                <a href="https://wa.me/9647507070313?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: تیشێرتا ڕەش" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> واتسئاپ
                </a>
            </div>
        </div>

        <!-- Hoodie Items -->
        <div class="product-card" data-category="hoodie">
            <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=400&q=80" alt="هوودی" class="product-img">
            <div class="product-info">
                <span class="product-category">هوودی</span>
                <h3 class="product-title">هوودیێ گەرم</h3>
                <div class="product-price">35,000 دینار</div>
                <a href="https://wa.me/9647507070313?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: هوودیێ گەرم" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> واتسئاپ
                </a>
            </div>
        </div>

        <!-- Jacket Items -->
        <div class="product-card" data-category="jacket">
            <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=400&q=80" alt="چاکەت" class="product-img">
            <div class="product-info">
                <span class="product-category">چاکەت</span>
                <h3 class="product-title">چاکەتێ چەرم</h3>
                <div class="product-price">65,000 دینار</div>
                <a href="https://wa.me/9647507070313?text=سڵاو، من حەز ڤێ کەلوپەلی دکەم: چاکەتێ چەرم" target="_blank" class="buy-btn">
                    <i class="fab fa-whatsapp"></i> واتسئاپ
                </a>
            </div>
        </div>

    </div>

    <a href="https://wa.me/9647507070313?text=سڵاو، من دخوازم پەیوەندی ب مە ڤە بکەم" target="_blank" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        function toggleMenu() {
            const sideMenu = document.getElementById('sideMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            sideMenu.classList.toggle('open');
            menuOverlay.classList.toggle('active');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        function filterProduct(category, event) {
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.closest('.cat-btn').classList.add('active');

            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
